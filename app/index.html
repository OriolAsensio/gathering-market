<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140e09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gather in One">
  <title>Gather in One</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gather in One">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="crest" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-crest"/></svg>
      <span>Gather in One</span>
      <button class="lang-btn icon-btn" id="share-btn" aria-label="Compartir la web"></button>
      <button class="lang-btn icon-btn" id="profile-btn" aria-label="Perfil"></button>
      <button class="lang-btn" id="lang-btn" aria-label="Idioma">ES</button>
    </div>
    <div class="treasury">
      <button class="eyebrow" id="top-label" aria-label="Valor de mis cartas">Valor de mis cartas</button>
      <div class="big" id="top-value">—</div>
      <div class="sub" id="top-sub"></div>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" id="scan-btn" aria-label="Escanear carta con la cámara">
    <svg viewBox="0 0 24 24"><use href="#i-camera"/></svg>
  </button>
  <input type="file" id="scan-input" accept="image/*" capture="environment" hidden>

  <nav class="tabs">
    <a href="#collection" data-tab="collection"><svg viewBox="0 0 24 24"><use href="#i-cards"/></svg><span>Cartas</span></a>
    <a href="#sets" data-tab="sets"><svg viewBox="0 0 24 24"><use href="#i-tome"/></svg><span>Colecciones</span></a>
    <a href="#decks" data-tab="decks"><svg viewBox="0 0 24 24"><use href="#i-swords"/></svg><span>Mazos</span></a>
    <a href="#life" data-tab="life"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg><span>Vidas</span></a>
    <a href="#versus" data-tab="versus"><svg viewBox="0 0 24 24"><use href="#i-bot"/></svg><span>Versus</span></a>
    <a href="#market" data-tab="market"><svg viewBox="0 0 24 24"><use href="#i-scales"/></svg><span>Mercado</span></a>
    <a href="#alerts" data-tab="alerts"><svg viewBox="0 0 24 24"><use href="#i-horn"/></svg><span>Avisos</span><i class="dot" id="alert-dot" hidden></i></a>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <button class="sheet-close" id="sheet-close" aria-label="Cerrar">✕</button>
    <div id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- Escudo heráldico con una moneda: el blasón de la app -->
    <symbol id="i-crest" viewBox="0 0 64 64">
      <g fill="none" stroke="var(--gold)" stroke-linecap="round" stroke-linejoin="round"><path d="M11 9v43h44" stroke-width="4.2"/><path d="M14 49 27 33l9 8 11-14" stroke-width="4.2"/></g>
      <g transform="rotate(14 49 16)"><rect x="42" y="6" width="14" height="20" rx="2" fill="var(--crest-fill)" stroke="var(--gold)" stroke-width="2.4"/><rect x="44.6" y="8.6" width="8.8" height="14.8" rx=".8" fill="none" stroke="var(--gold)" stroke-width=".8" opacity=".55"/><path d="M49 11.5l2.6 4.5-2.6 4.5-2.6-4.5z" fill="var(--gold)"/></g>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="7" y="3" width="12" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 6v13a2 2 0 0 0 2 2h9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 8l2 3-2 3-2-3z" fill="currentColor"/></symbol>
    <symbol id="i-tome" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M5 17a3 3 0 0 1 3-3h11" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 6.5l1.2 2.3 2.3 1.2-2.3 1.2L12 13.5l-1.2-2.3L8.5 10l2.3-1.2z" fill="currentColor"/></symbol>
    <symbol id="i-swords" viewBox="0 0 24 24"><path d="M4 4l11 11M20 4L9 15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M13 17l4-4M11 17l-4-4M15.5 16.5l3 3M8.5 16.5l-3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-scales" viewBox="0 0 24 24"><path d="M12 3v17M7 20h10M5 7h14M12 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-horn" viewBox="0 0 24 24"><path d="M3 15c5 0 11-3 16-9l1 1c-1 7-6 12-13 12H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7 15v4M18 4l2-1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5M3 12v3M21 12v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="3.5" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-9.2C1.6 7.3 3.7 4 7 4c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.3 0 5.4 3.3 4 6.8C19 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 11h8M12 7v8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </svg>
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script src="play.js"></script>
  <script src="life.js"></script>
  <script src="versus.js"></script>
</body>
</html>
