# Gather in One en GitHub (gratis, no necesita tu PC encendido).
#
# Dos veces al día:
#   1. Recupera la base de datos (adjunta a la release "datos").
#   2. Descarga precios (Scryfall), colecciones, meta (MTGTop8) y genera avisos.
#   3. Envía los avisos generales al móvil por ntfy (secreto NTFY_TOPIC).
#   4. Vuelve a guardar la base de datos en la release.
#   5. Publica en GitHub Pages el paquete de datos (lo que descarga la app) y la versión web de la app.
# Al subir cambios de la app: solo rehace el paquete con la base de datos guardada y publica la web (un par de minutos).
# Si el mensaje del commit lleva "[datos]", hace la tarea diaria completa (para cambios en pipeline/ que deben verse ya).
name: Datos diarios

on:
  schedule:
    # 07:00 y 19:00 UTC = 8:00 y 20:00 en España en invierno (9:00 y 21:00 en verano).
    # La segunda vuelta refresca el meta; los precios del día no se repiten y los avisos tampoco.
    - cron: "0 7,19 * * *"
  workflow_dispatch:        # botón "Run workflow" para lanzarla a mano
  push:
    branches: [main]
    paths: ["app/**", "pipeline/**", ".github/workflows/daily.yml"]

permissions:
  contents: write   # guardar la base de datos en la release
  pages: write      # publicar el paquete y la web
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Recuperar la base de datos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download datos --pattern mtg.db.gz --dir data; then
            gunzip -f data/mtg.db.gz
          else
            echo "Primera ejecución: se crea una base de datos nueva."
          fi

      - name: Tarea diaria
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[datos]')
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pipeline/daily.py --stdout --pack site

      - name: Solo el paquete (cambios en la app)
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[datos]')
        run: python pipeline/export_pack.py site

      - name: Guardar la base de datos
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[datos]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -kf data/mtg.db
          gh release view datos >/dev/null 2>&1 || gh release create datos --title "Base de datos" --notes "Copia diaria de la base de datos (la usa la tarea diaria)."
          gh release upload datos data/mtg.db.gz --clobber

      # La web: la misma app que el APK, junto al paquete (el escáner baja su lector de texto de internet).
      - name: Versión web
        run: |
          rsync -a --exclude pack --exclude config.js app/ site/
          printf 'window.GM_CONFIG = { packUrl: "./" };  // web: el paquete está al lado\n' > site/config.js
          # Cada publicación cambia la "versión" de los archivos para que el navegador no use una copia vieja.
          v="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          sed -i -E "s/(src|href)=\"(app|engine|i18n|config|supabase|play|life)\.js\"/\1=\"\2.js?v=$v\"/g; s/href=\"style\.css\"/href=\"style.css?v=$v\"/; s/href=\"(icon\.svg|apple-touch-icon\.png|manifest\.webmanifest)\"/href=\"\1?v=$v\"/g" site/index.html
          # los iconos también llevan versión: si no, el navegador y el móvil siguen enseñando el logo viejo
          sed -i -E "s/\"(icon-512\.png|icon\.svg)\"/\"\1?v=$v\"/g" site/manifest.webmanifest
          grep -c "?v=$v" site/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true   # a veces GitHub aún no "ve" lo recién subido: se reintenta abajo
      - name: Esperar y reintentar la publicación
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
